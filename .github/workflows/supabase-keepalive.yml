name: Supabase keep-alive

on:
  schedule:
    # Every 6 days (day-of-month 1, 7, 13, 19, 25, 31). Keeps the free-tier
    # project from pausing after 7 days without activity.
    - cron: "0 6 */6 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL repository variable is not set"
            exit 1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY repository variable is not set"
            exit 1
          fi
          code=$(curl -sS -o /tmp/body -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-all-errors \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$SUPABASE_URL/auth/v1/health")
          echo "HTTP $code"
          cat /tmp/body
          case "$code" in
            2*) echo "Supabase project is awake (HTTP $code)." ;;
            *) echo "::error::Supabase health check returned HTTP $code"; exit 1 ;;
          esac
